name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup npm
        run: npm install --global "npm@^11.5.1"

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Publish
        run: npm publish --provenance --access public
